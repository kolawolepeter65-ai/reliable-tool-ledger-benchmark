[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-tool-ledger-benchmark"
version = "0.1.0"
description = "A reproducible SWE-agent coding evaluation task"
requires-python = ">=3.9"
dependencies = ["streamlit>=1.32,<2"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
where = ["src"]
